<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>独白</title>
    <link href="/main.css" rel="stylesheet"/>
</head>
<body>

<!-- 自定义标题栏 -->
<div id="titlebar">
    <div class="titlebar-resize-edge"></div>
    <div class="titlebar-drag">
        <span class="titlebar-title">独白</span>
    </div>
    <div class="titlebar-controls">
        <button class="titlebar-btn" id="btn-minimize" title="最小化">
            <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" fill="currentColor"/></svg>
        </button>
        <button class="titlebar-btn" id="btn-maximize" title="最大化">
            <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="关闭">
            <svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
    </div>
</div>

<!-- 主布局 -->
<div id="main-content">
    <!-- 左侧边栏 -->
    <div id="sidebar">
        <!-- 工具栏 -->
        <div id="sidebar-toolbar">
            <button class="sidebar-btn" id="btn-new-folder" title="新建文件夹">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H8.414L7.121 2.707A1 1 0 0 0 6.414 2.5H3a1 1 0 0 0-1 .5z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="sidebar-btn" id="btn-new-note" title="新建笔记">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V4l-4-3z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M10 1v3h3" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1"/><line x1="5" y1="11" x2="11" y2="11" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="sidebar-btn" id="btn-collapse-all" title="折叠全部">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(90deg);"><path d="m20 17-5-5 5-5"/><path d="m4 17 5-5-5-5"/></svg>
            </button>
            <button class="sidebar-btn" id="btn-import-md" title="导入.md文件">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1v10M4 7l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 14h12" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <button class="sidebar-btn" id="btn-refresh" title="刷新文件列表">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            </button>
            <button class="sidebar-btn" id="btn-highlights" title="高亮合集">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17h8v-2.3c1.8-1.3 3-3.4 3-5.7a7 7 0 0 0-7-7z"/></svg>
            </button>
        </div>

        <!-- 文件树 -->
        <div id="file-tree">
            <div class="tree-empty">暂无笔记，点击 + 创建</div>
        </div>

        <!-- 侧边栏拖拽调整宽度 -->
        <div id="sidebar-resizer"></div>
    </div>

    <!-- 右侧编辑区 -->
    <div id="editor-area">
        <!-- 编辑器工具栏 -->
        <div id="editor-toolbar">
            <button class="format-btn" data-format="bold" title="加粗 Ctrl+B">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg>
            </button>
            <button class="format-btn" data-format="italic" title="斜体 Ctrl+I">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></svg>
            </button>
            <button class="format-btn" data-format="underline" title="下划线 Ctrl+U">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 14h10M4 2v6a4 4 0 0 0 8 0V2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="format-btn" data-format="strikeThrough" title="删除线">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg>
            </button>
            <button class="format-btn" data-format="highlight" title="高亮">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17h8v-2.3c1.8-1.3 3-3.4 3-5.7a7 7 0 0 0-7-7z"/></svg>
            </button>
            <button class="format-btn" data-format="spoiler" title="黑幕">
                <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
            </button>
            <span class="toolbar-separator"></span>
            <button class="format-btn" data-format="heading1" title="一级标题">
                <svg width="16" height="16" viewBox="0 0 16 16"><text x="8" y="13.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="sans-serif">H<tspan font-size="9">1</tspan></text></svg>
            </button>
            <button class="format-btn" data-format="heading2" title="二级标题">
                <svg width="16" height="16" viewBox="0 0 16 16"><text x="8" y="13.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="sans-serif">H<tspan font-size="9">2</tspan></text></svg>
            </button>
            <button class="format-btn" data-format="heading3" title="三级标题">
                <svg width="16" height="16" viewBox="0 0 16 16"><text x="8" y="13.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="sans-serif">H<tspan font-size="9">3</tspan></text></svg>
            </button>
            <button class="format-btn" data-format="blockquote" title="引用">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h6v4H3z"/><path d="M3 5h6v4H3z"/><path d="M13 7h8"/><path d="M13 15h8"/></svg>
            </button>
            <button class="format-btn" data-format="link" title="链接">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
            <span class="toolbar-separator"></span>
            <button class="format-btn" data-format="hr" title="分割线">
                <svg width="16" height="16" viewBox="0 0 16 16"><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <span class="toolbar-separator"></span>
            <button class="format-btn" id="btn-insert-image" title="插入图片">
                <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5" cy="6" r="1.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M1.5 11l4-4 3 2 2-2 4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="format-btn" id="btn-insert-video" title="插入视频">
                <svg width="16" height="16" viewBox="0 0 15 15"><rect x="1.5" y="3.5" width="13" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><polygon points="6.5,5.5 6.5,10.5 11,8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="format-btn" id="btn-insert-audio" title="插入音频">
                <svg width="16" height="16" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
            <button class="format-btn toolbar-search-btn" id="btn-search" title="搜索笔记 Ctrl+F">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
            </button>
        </div>

        <!-- 搜索面板 -->
        <div id="search-panel" style="display:none">
            <div class="search-input-row">
                <svg class="search-input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="搜索笔记内容..."/>
                <button id="btn-search-close" class="search-close-btn" title="关闭">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
                </button>
            </div>
            <div id="search-results"></div>
        </div>

        <!-- 高亮合集面板 -->
        <div id="highlights-panel" style="display:none">
            <div class="highlights-header">
                <span>高亮合集</span>
                <button id="btn-highlights-close" class="highlights-close-btn" title="关闭">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
                </button>
            </div>
            <div id="highlights-results"></div>
        </div>

        <!-- 编辑器主区域 -->
        <div id="editor-wrapper">
            <div id="editor-empty">选择或创建一个笔记开始记录</div>
            <!-- Tiptap Editor Container -->
            <div id="editor-container" class="editor-content" style="display:none;"></div>
        </div>
    </div>
</div>

<!-- 音频播放控制台 -->
<div id="audio-controls" style="display:none;">
    <div class="audio-info">
        <span class="audio-icon">
            <svg width="22" height="18" viewBox="0 0 16 16">
                <path d="M3 4.5h1.5L8 1.5v13L4.5 11.5H3a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.2"/>
                <path d="M10 6a2.5 2.5 0 0 1 0 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M12 4.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
        </span>
        <span class="audio-name" id="audio-name">未选择音频</span>
    </div>
    <div class="audio-progress-container" id="audio-progress-bar">
        <div class="audio-progress" id="audio-progress-fill"></div>
        <div class="audio-progress-thumb" id="audio-progress-thumb"></div>
    </div>
    <span class="audio-time" id="audio-time">00:00 / 00:00</span>
    <button class="audio-btn" id="btn-audio-play">
        <svg width="14" height="14" viewBox="0 0 16 16"><polygon points="4,2 4,14 13,8" fill="currentColor"/></svg>
    </button>
    <button class="audio-btn" id="btn-audio-close" title="关闭">
        <svg width="14" height="14" viewBox="0 0 16 16"><line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="audio-volume-container">
        <input type="range" id="audio-volume" min="0" max="100" value="10" class="audio-volume-slider"/>
    </div>
</div>

<!-- 图片查看器 -->
<div id="image-viewer" style="display:none;">
    <div class="image-viewer-bg"></div>
    <img id="image-viewer-img" src="" alt=""/>
    <button class="image-viewer-close" id="btn-close-viewer">
        <svg width="24" height="24" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/></svg>
    </button>
</div>

<!-- 视频播放器 -->
<div id="video-player" style="display:none;">
    <div class="video-player-bg"></div>
    <div class="video-player-container">
        <video id="video-player-el" controls></video>
        <button class="video-player-close" id="btn-close-video">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/></svg>
        </button>
    </div>
</div>

<!-- 自定义右键菜单 -->
<div id="context-menu" style="display:none;">
    <div class="context-menu-item" data-action="rename">重命名</div>
    <div class="context-menu-item context-menu-danger" data-action="delete">删除</div>
</div>
<div id="context-menu-folder" style="display:none;">
    <div class="context-menu-item" data-action="rename">重命名</div>
    <div class="context-menu-item context-menu-danger" data-action="delete-folder">删除文件夹（内容上移）</div>
</div>
<div id="context-menu-media" style="display:none;">
    <div class="context-menu-item" data-action="open-default">用默认程序打开</div>
    <div class="context-menu-item" data-action="open-location">打开文件所在位置</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item context-menu-danger" data-action="delete-media">删除</div>
</div>

<!-- 重命名输入框 -->
<div id="rename-overlay" style="display:none;">
    <div class="rename-dialog">
        <input type="text" id="rename-input" class="rename-input" placeholder="输入新名称"/>
        <div class="rename-buttons">
            <button class="rename-btn rename-btn-cancel" id="btn-rename-cancel">取消</button>
            <button class="rename-btn rename-btn-confirm" id="btn-rename-confirm">确定</button>
        </div>
    </div>
</div>

<!-- 链接输入框 -->
<div id="link-overlay" style="display:none;">
    <div class="rename-dialog">
        <input type="text" id="link-input" class="rename-input" placeholder="输入链接地址"/>
        <div class="rename-buttons">
            <button class="rename-btn rename-btn-cancel" id="btn-link-cancel">取消</button>
            <button class="rename-btn rename-btn-confirm" id="btn-link-confirm">确定</button>
        </div>
    </div>
</div>

<!-- 自定义确认对话框 -->
<div id="confirm-dialog" style="display:none;">
    <div class="confirm-bg"></div>
    <div class="confirm-box">
        <div class="confirm-msg" id="confirm-msg"></div>
        <div class="confirm-buttons">
            <button class="confirm-btn confirm-btn-cancel" id="confirm-cancel">取消</button>
            <button class="confirm-btn confirm-btn-ok" id="confirm-ok">确定</button>
        </div>
    </div>
</div>

<script src="/tiptap-bundle.js"></script>
    <script src="/main.js"></script>
</body>
</html>
